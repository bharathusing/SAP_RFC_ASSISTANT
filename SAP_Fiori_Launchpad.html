<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAP Fiori Launchpad – RFC Toolkit</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
--shell:#ffffff;--bg:#f5f6f7;--card:#fff;--ink:#32363a;--mute:#6a6d70;--line:#d9d9d9;--brand:#0a6ed1;--brandH:#085caf;--ok:#107e3e;--okbg:#f1fdf6;--bad:#bb0000;--badbg:#ffebeb;--warn:#e9730c;--code:#1d2d3e;--hdr:#fff}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "72","72full",Arial,Helvetica,sans-serif}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.12em}
/* Shell bar */
.shell{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;height:44px;background:var(--shell);color:var(--ink);display:flex;align-items:center;gap:14px;padding:0 12px;border-bottom:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.sapl{height:24px;display:block}
.shell h1{font-size:14px;font-weight:400;margin:0;white-space:nowrap}
.sb{flex:1;max-width:420px;margin:0 auto;display:flex;align-items:center;gap:8px;background:#f5f6f7;border:1px solid var(--line);border-radius:8px;padding:0 10px;height:32px;color:var(--mute)}
.sb input{background:none;border:0;color:var(--ink);width:100%;outline:0;font:inherit}.sb input::placeholder{color:var(--mute)}
.sh-btn{background:none;border:0;color:var(--ink);font-size:18px;width:34px;height:34px;border-radius:6px;cursor:pointer;display:grid;place-items:center;position:relative}
.sh-btn:hover{background:#eaecee}
.sysp{display:flex;align-items:center;gap:6px;font-size:12px;background:#f5f6f7;border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:5px 11px;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:#e9730c}.dot.on{background:#107e3e}
.av{width:30px;height:30px;border-radius:50%;background:#0a6ed1;display:grid;place-items:center;font-size:12px;font-weight:700;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);color:#fff}
@media(max-width:700px){.sb,.sysp span#connTxt{display:none}}
main{max-width:1200px;margin:0 auto;padding:20px 16px 110px}
/* Page header */
.ph{background:var(--hdr);margin:-20px -16px 20px;padding:14px 24px 14px;border-bottom:1px solid var(--line)}
.bc{font-size:12px;color:var(--mute);display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.bc a{color:var(--brand);cursor:pointer}.bc a:hover{text-decoration:underline}
.ph h2{margin:0;font-size:24px;font-weight:400;display:flex;gap:10px;align-items:center}.ph p{margin:2px 0 0;color:var(--mute);font-size:13px}
.ph .back{background:none;border:1px solid var(--line);border-radius:6px;color:var(--brand);width:32px;height:32px;cursor:pointer;font-size:16px}
.gt{font-size:16px;font-weight:700;margin:18px 0 12px;color:var(--ink)}
/* Tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 0 0 .0625rem rgba(0,0,0,.1),0 .125rem .5rem rgba(0,0,0,.1);height:176px;padding:16px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;transition:background .12s,box-shadow .12s;position:relative}
.tile:hover{background:color-mix(in srgb,var(--brand) 6%,var(--card));box-shadow:0 0 0 .0625rem var(--brand),0 .25rem .75rem rgba(0,0,0,.15)}
.tile:active{background:color-mix(in srgb,var(--brand) 14%,var(--card))}
.tile:focus-visible,.btn:focus-visible,.fi:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.tile .t{font-size:16px;font-weight:600;line-height:1.25}.tile .s{font-size:13px;color:var(--mute);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .ic{margin-top:auto;font-size:34px;color:var(--c,var(--brand))}
.tile .ft{position:absolute;right:16px;bottom:14px;font-size:11px;color:var(--mute);font-family:ui-monospace,Menlo,monospace;max-width:60%;text-align:right}
.tile .kpi{position:absolute;right:16px;bottom:14px;font-size:28px;font-weight:300}.tile .kpi small{font-size:12px;color:var(--mute);margin-left:3px}
.tile.off{opacity:.55;cursor:not-allowed}.tile.off:hover{background:var(--card);box-shadow:0 0 0 .0625rem rgba(0,0,0,.1),0 .125rem .5rem rgba(0,0,0,.1)}
.tile.add{background:transparent;border:1px dashed var(--mute);box-shadow:none;align-items:center;justify-content:center;color:var(--mute);gap:6px}.tile.add .ic{margin:0;color:var(--mute)}
.state{font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;background:#e5f0fa;color:#0a6ed1;position:absolute;right:14px;top:14px}
/* Forms */
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;box-shadow:0 0 0 .0625rem rgba(0,0,0,.05),0 .125rem .5rem rgba(0,0,0,.08);overflow:hidden}
.sec>h3{margin:0;padding:12px 20px;font-size:16px;font-weight:600;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.sec .fields{padding:18px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px 20px}
.chip{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;color:#fff;background:var(--c)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:820px){.two{grid-template-columns:1fr}}
.two .sec .fields{grid-template-columns:1fr 1fr}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}label i{color:var(--bad);font-style:normal}
.fi{width:100%;height:36px;padding:0 10px;border:1px solid #89919a;border-radius:6px;background:var(--card);color:var(--ink);font:inherit}
.fi:hover{border-color:var(--brand)}.fi.err{border-color:var(--bad);background:var(--badbg)}
.ft-bar{position:fixed;left:0;right:0;bottom:0;padding:10px 24px calc(10px + env(safe-area-inset-bottom,0px));background:var(--hdr);border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;z-index:9;box-shadow:0 -2px 6px rgba(0,0,0,.08)}
.btn{height:36px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--brand);font:600 14px inherit;cursor:pointer}
.btn:hover{background:color-mix(in srgb,var(--brand) 8%,var(--card))}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}.btn.p:hover{background:var(--brandH)}
.btn.n{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.g{border-color:transparent;background:transparent}.btn:disabled{opacity:.55;cursor:wait}
/* Message strips */
.strip{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:8px;border:1px solid;margin-bottom:16px;font-size:14px}
.strip.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.strip.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.strip b{color:var(--ink)}.strip span{color:var(--ink)}
pre{margin:0;background:var(--code);color:#cfe3ff;padding:14px;border-radius:8px;overflow-x:auto;font:12px/1.55 ui-monospace,Menlo,monospace;max-height:300px}
.log{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:12px}
.log li{display:flex;gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line)}.log li:last-child{border:0}
.log time{margin-left:auto;color:var(--mute);font-size:12px}.log .ok{color:var(--ok)}.log .bad{color:var(--bad)}.empty{padding:16px;color:var(--mute)}
/* Dialog + toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;z-index:30;padding:16px}.scrim.on{display:grid}
.dlg{background:var(--card);border-radius:12px;width:min(480px,100%);box-shadow:0 0 0 1px rgba(0,0,0,.2),0 8px 32px rgba(0,0,0,.4);overflow:hidden}
.dlg h3{margin:0;padding:14px 20px;font-size:16px;font-weight:600;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.dlg .bd{padding:18px 20px}.dlg .bd .fi{margin-bottom:12px}.dlg .ac{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:var(--bg)}
.note{font-size:12px;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#32363a;color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:40}#toast.on{opacity:.95}
</style>
</head>
<body>
<div class="shell">
  <button class="sh-btn" id="home" title="Home" aria-label="Home">
    <svg class="sapl" viewBox="0 0 100 50" aria-label="SAP"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00b8f1"/><stop offset="1" stop-color="#0a6ed1"/></linearGradient></defs><path d="M0 0h100L50 50H0z" fill="url(#g)"/><text x="12" y="31" font-family="Arial Black,Arial" font-weight="900" font-size="26" fill="#fff" letter-spacing="1">SAP</text></svg>
  </button>
  <h1 id="shTitle">Home</h1>
  <div class="sb"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" placeholder="Search apps" aria-label="Search apps"></div>
  <button class="sysp" id="conn"><span class="dot" id="dot"></span><span id="connTxt">Mock mode</span></button>
  <button class="sh-btn" aria-label="Notifications"><svg class="i" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4zM10 21h4"/></svg></button>
  <div class="av">SU</div>
</div>
<main id="app"></main>
<div id="bar"></div>
<div class="scrim" id="scrim"><div class="dlg" id="dlg"></div></div>
<div id="toast"></div>

<script>
const IC={layers:'<path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="m3 13 9 5 9-5"/>',plus:'<path d="M12 5v14M5 12h14"/>',copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',box:'<path d="M12 3 3 7.5v9L12 21l9-4.5v-9L12 3zM3 7.5l9 4.5 9-4.5M12 12v9"/>',tool:'<path d="M14 6a4 4 0 0 0 5 5l-9 9-3-3 9-9a4 4 0 0 0-2-2z"/>',doc:'<path d="M7 3h8l4 4v14H7zM15 3v4h4M10 12h6M10 16h6"/>',fac:'<path d="M3 21V10l6 4V10l6 4V6h6v15z"/>',back:'<path d="M15 5l-7 7 7 7"/>',warn:'<path d="M12 3l10 18H2zM12 10v5M12 18v.5"/>',ok:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',err:'<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/>'};
const I=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`;

/* ===== 1. MODULE REGISTRY — add new apps / actions here ===== */
const U=[["1","Production"],["2","Engineering/design"],["3","Universal"],["5","Sales and distribution"]];
const std=[{k:"MATERIAL",l:"Material",req:1,ph:"FG-1000"},{k:"PLANT",l:"Plant",req:1,ph:"1000"},{k:"BOM_USAGE",l:"BOM Usage",req:1,t:"select",o:U},{k:"ALTERNATIVE",l:"Alternative BOM",ph:"01"},{k:"VALID_FROM",l:"Valid From",t:"date"}];
const MODULES=[
 {id:"bom",icon:"layers",title:"Bill of Materials",desc:"Create, copy, change, display and delete BOMs",group:"Production Planning",
  actions:[
  {id:"display",icon:"search",title:"Display BOM",desc:"Read BOM header and components",fm:"CSAP_MAT_BOM_READ",sections:[{name:"BOM Selection",fields:std}]},
  {id:"create",icon:"plus",title:"Create BOM",desc:"Create a new material BOM",fm:"CSAP_MAT_BOM_CREATE",sections:[{name:"BOM Header",fields:[...std,{k:"BASE_QTY",l:"Base Quantity",ph:"1"},{k:"BASE_UOM",l:"Base Unit",ph:"EA"}]},{name:"First Component",fields:[{k:"COMP",l:"Component",ph:"RM-200",req:1},{k:"COMP_QTY",l:"Quantity",ph:"2",req:1},{k:"ITEM_CAT",l:"Item Category",ph:"L"}]}]},
  {id:"copy",icon:"copy",title:"Copy BOM",desc:"Copy a BOM from source to target",fm:"CSAP_MAT_BOM_CREATE",sections:[
    {name:"Source Details",tag:"Source",color:"#0a6ed1",fields:std.map(f=>({...f,k:"SRC_"+f.k}))},
    {name:"Target Details",tag:"Target",color:"#107e3e",fields:std.map(f=>({...f,k:"TGT_"+f.k}))}]},
  {id:"change",icon:"edit",title:"Change BOM",desc:"Modify header or components",fm:"CSAP_MAT_BOM_MAINTAIN",sections:[{name:"BOM Selection",fields:[...std,{k:"CHANGE_NO",l:"Change Number",ph:"optional"}]}]},
  {id:"delete",icon:"trash",title:"Delete BOM",desc:"Delete a BOM (confirmation required)",fm:"CSAP_MAT_BOM_DELETE",danger:1,sections:[{name:"BOM Selection",fields:std}]}]},
 {id:"mat",icon:"box",title:"Material Master",desc:"Material data maintenance",group:"Master Data",soon:1},
 {id:"rout",icon:"tool",title:"Routing",desc:"Task lists and operations",group:"Production Planning",soon:1},
 {id:"po",icon:"doc",title:"Purchase Orders",desc:"Create and monitor purchase orders",group:"Procurement",soon:1},
 {id:"prod",icon:"fac",title:"Production Orders",desc:"Order release and confirmation",group:"Production Planning",soon:1}];

/* ===== 2. RFC ADAPTER — point to your backend endpoint ===== */
function sg(k){try{return localStorage.getItem(k)}catch(e){return null}}
function ss(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const cfg=JSON.parse(sg("rfcCfg")||'{"url":"","host":"","sysnr":"00","client":"100","user":""}');
async function callRFC(fm,params){
  const body={function:fm,params,conn:{host:cfg.host,sysnr:cfg.sysnr,client:cfg.client,user:cfg.user}};
  if(cfg.url){const r=await fetch(cfg.url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(!r.ok)throw new Error("Backend HTTP "+r.status);return{request:body,response:await r.json()}}
  await new Promise(r=>setTimeout(r,900));
  return{request:body,response:{ok:true,mock:true,RETURN:[{TYPE:"S",ID:"29",NUMBER:"000",MESSAGE:"Simulated: "+fm+" executed successfully"}]}}}

/* ===== 3. UI ===== */
const $=s=>document.querySelector(s),app=$("#app");let S={view:"home"},LOG=[];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mod=()=>MODULES.find(m=>m.id===S.m),act=()=>mod().actions.find(a=>a.id===S.a);
function go(v,m,a){S={view:v,m,a};render();scrollTo(0,0)}
$("#home").onclick=()=>go("home");
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2600)}
function head(title,sub,back){const m=S.m?mod():null,a=S.a?act():null;
  return`<div class="ph"><div class="bc"><a onclick="go('home')">Home</a>${m?` › <a onclick="go('actions','${m.id}')">${m.title}</a>`:""}${a?` › <span>${a.title}</span>`:""}</div>
  <h2>${back?`<button class="back" onclick="${back}" aria-label="Back">${I("back")}</button>`:""}${title}</h2><p>${sub}</p></div>`}
function tile(o,click,right,color){return`<button class="tile ${o.soon?"off":""}" ${o.soon?"disabled":`onclick="${click}"`} style="--c:${color||"var(--brand)"}">
  ${o.soon?'<span class="state">Coming soon</span>':""}<div class="t">${o.title}</div><div class="s">${o.desc}</div><div class="ic">${I(o.icon)}</div>${right||""}</button>`}
function render(){const q=($("#q").value||"").toLowerCase();$("#bar").innerHTML="";
  if(S.view==="home"){$("#shTitle").textContent="Home";
    const groups={};MODULES.filter(m=>!q||(m.title+m.desc).toLowerCase().includes(q)).forEach(m=>(groups[m.group]=groups[m.group]||[]).push(m));
    app.innerHTML=head("My Home","Fiori launchpad · SAP RFC toolkit")+Object.keys(groups).map(g=>`<div class="gt">${g}</div><div class="grid">${groups[g].map(m=>tile(m,`go('actions','${m.id}')`,m.soon?"":`<div class="kpi">${m.actions.length}<small>apps</small></div>`)).join("")}</div>`).join("")
    +`<div class="gt">Add</div><div class="grid"><button class="tile add" onclick="addInfo()"><div class="ic">${I("plus")}</div>Add application</button></div>
    <div class="gt">Recent RFC activity</div>${LOG.length?`<ul class="log">${LOG.slice(0,6).map(l=>`<li><span class="${l.ok?"ok":"bad"}">${I(l.ok?"ok":"err")}</span><b>${l.t}</b><span>${esc(l.m||"")}</span><time>${l.time}</time></li>`).join("")}</ul>`:'<div class="log"><div class="empty">No calls yet – open Bill of Materials to begin.</div></div>'}`;
  }else if(S.view==="actions"){const m=mod();$("#shTitle").textContent=m.title;
    app.innerHTML=head(m.title,"Choose an operation","go('home')")+`<div class="gt">Operations</div><div class="grid">${m.actions.map(a=>tile(a,`go('form','${m.id}','${a.id}')`,`<div class="ft">${a.fm}</div>`,a.danger?"var(--bad)":"")).join("")}</div>`;
  }else{const m=mod(),a=act();$("#shTitle").textContent=a.title;
    app.innerHTML=head(a.title,`Function module: ${a.fm}`,`go('actions','${m.id}')`)+`<div id="out"></div><div class="${a.sections[0].tag?"two":""}">
    ${a.sections.map(s=>`<div class="sec" style="--c:${s.color||"var(--brand)"}"><h3>${s.tag?`<span class="chip">${s.tag}</span>`:""}${s.name}</h3><div class="fields">${s.fields.map(fld).join("")}</div></div>`).join("")}</div>`;
    $("#bar").innerHTML=`<div class="ft-bar"><button class="btn g" onclick="go('actions','${m.id}')">Cancel</button>${a.id==="copy"?`<button class="btn" onclick="mirror()">Copy Source to Target</button>`:""}<button class="btn ${a.danger?"n":"p"}" id="run" onclick="submit()">${a.danger?"Delete":"Execute"}</button></div>`}}
$("#q").oninput=()=>{if(S.view!=="home")S={view:"home"};render()};
function fld(f){const id="f_"+f.k;return`<div><label for="${id}">${f.l}${f.req?" <i>*</i>":""}</label>${f.t==="select"?`<select class="fi" id="${id}">${f.o.map(o=>`<option value="${o[0]}">${o[0]} – ${o[1]}</option>`).join("")}</select>`:`<input class="fi" id="${id}" type="${f.t||"text"}" placeholder="${f.ph||""}" autocomplete="off">`}</div>`}
function mirror(){act().sections[0].fields.forEach(f=>{const t=$("#f_"+f.k.replace("SRC_","TGT_"));if(t)t.value=$("#f_"+f.k).value});toast("Source values copied to target")}
function collect(){const p={},miss=[];act().sections.forEach(s=>s.fields.forEach(f=>{const el=$("#f_"+f.k),v=el.value.trim();el.classList.remove("err");
  if(f.req&&!v){el.classList.add("err");miss.push(f.l)}if(v)p[f.k]=/MATERIAL$|^COMP$/.test(f.k)?v.toUpperCase():v}));return{p,miss}}
function structured(p){if(act().id!=="copy")return p;const o={SOURCE:{},TARGET:{}};for(const k in p)(k.startsWith("SRC_")?o.SOURCE:o.TARGET)[k.slice(4)]=p[k];return o}
function strip(t,msg,h){return`<div class="strip ${t}">${I(t==="ok"?"ok":"err")}<span><b>${h||""}</b> ${msg}</span></div>`}
function submit(){const{p,miss}=collect();
  if(miss.length){$("#out").innerHTML=strip("bad","Fill in the required fields: "+miss.join(", "),"Input incomplete.");return}
  if(act().id==="copy"){const s=structured(p).SOURCE,t=structured(p).TARGET;if(s.MATERIAL===t.MATERIAL&&s.PLANT===t.PLANT&&(s.ALTERNATIVE||"")===(t.ALTERNATIVE||"")){$("#out").innerHTML=strip("bad","Source and target are identical – change target material, plant or alternative.","Invalid target.");return}}
  act().danger?confirmDel(p):run(p)}
function dlg(h,b,ac){$("#dlg").innerHTML=`<h3>${h}</h3><div class="bd">${b}</div><div class="ac">${ac}</div>`;$("#scrim").classList.add("on")}
function closeM(){$("#scrim").classList.remove("on")}
let pend;function confirmDel(p){pend=p;dlg(`<span style="color:var(--warn)">${I("warn")}</span> Confirmation`,`Delete the BOM for material <b>${esc(p.MATERIAL)}</b> in plant <b>${esc(p.PLANT)}</b>? This action cannot be undone.`,`<button class="btn g" onclick="closeM()">Cancel</button><button class="btn n" onclick="closeM();run(pend)">Delete</button>`)}
async function run(p){const a=act(),b=$("#run");b.disabled=true;b.textContent="Processing…";
  try{const r=await callRFC(a.fm,structured(p));LOG.unshift({t:a.title,m:p.MATERIAL||p.SRC_MATERIAL,ok:1,time:new Date().toLocaleTimeString()});
    $("#out").innerHTML=strip("ok",esc((r.response.RETURN&&r.response.RETURN[0].MESSAGE)||"Success")+(r.response.mock?" (mock mode)":""),"Success.")+`<div class="two" style="margin-bottom:16px"><div><label>RFC request</label><pre>${esc(JSON.stringify(r.request,null,2))}</pre></div><div><label>RFC response</label><pre>${esc(JSON.stringify(r.response,null,2))}</pre></div></div>`;toast(a.title+" completed")
  }catch(e){LOG.unshift({t:a.title,m:p.MATERIAL||"",ok:0,time:new Date().toLocaleTimeString()});$("#out").innerHTML=strip("bad",esc(e.message),"RFC call failed.")}
  b.disabled=false;b.textContent=a.danger?"Delete":"Execute";scrollTo({top:0,behavior:"smooth"})}
$("#conn").onclick=()=>{const f=(k,l,ph)=>`<label>${l}</label><input class="fi" id="c_${k}" value="${esc(cfg[k]||"")}" placeholder="${ph||""}">`;
  dlg("System Connection",`${f("url","Backend endpoint (REST → RFC gateway)","https://your-server/api/rfc")}${f("host","Application server")}${f("sysnr","System number")}${f("client","Client")}${f("user","User")}<div class="note">No passwords here – keep credentials on your backend. Leave the endpoint empty for mock mode.</div>`,`<button class="btn g" onclick="closeM()">Close</button><button class="btn p" onclick="saveCfg()">Save</button>`)};
function saveCfg(){["url","host","sysnr","client","user"].forEach(k=>cfg[k]=$("#c_"+k).value.trim());ss("rfcCfg",JSON.stringify(cfg));closeM();status();toast("Connection saved")}
function status(){const on=!!cfg.url;$("#dot").className="dot"+(on?" on":"");$("#connTxt").textContent=on?`System · Client ${cfg.client||"—"}`:"Mock mode"}
function addInfo(){dlg("Add application","Add an object to the <code>MODULES</code> array (title, icon, group, actions with fields and function module). The tile, form, validation and RFC call are generated automatically.",`<button class="btn p" onclick="closeM()">OK</button>`)}
$("#scrim").onclick=e=>{if(e.target.id==="scrim")closeM()};
status();render();
</script>
</body>
